<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hronir LLC</title>
    <meta
      name="description"
      content="Hronir LLC - manifesting software objects."
    >
    <meta property="og:title" content="Hronir LLC">
    <meta
      property="og:description"
      content="manifesting software objects"
    >
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/hronir-rabbit.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="assets/hronir-rabbit.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="sigil" aria-labelledby="hero-title">
      <div class="backdrop" aria-hidden="true"></div>
      <div class="glow" aria-hidden="true"></div>
      <div class="grid" aria-hidden="true"></div>

      <section class="terminal">
        <div class="terminal__body">
          <div class="rail" aria-hidden="true"></div>
          <div class="block">
            <div class="mark" aria-hidden="true">
              <img class="mark__image mark__image--echo-one" src="assets/hronir-rabbit.svg" alt="">
              <img class="mark__image mark__image--echo-two" src="assets/hronir-rabbit.svg" alt="">
              <img class="mark__image mark__image--base" src="assets/hronir-rabbit.svg" alt="">
            </div>
            <h1 id="hero-title" data-text="Hronir LLC">Hronir <em>LLC</em></h1>
            <p class="tagline">manifesting software objects</p>
          </div>
        </div>
      </section>

      <button class="email" id="contact" type="button" aria-label="Email Hronir LLC">
        <span>hello [at] hronir [dot] dev</span>
      </button>
    </main>

    <script src="site.js"></script>
  </body>
