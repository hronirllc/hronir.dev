<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">Hronir LLC mark</title>
  <desc id="desc">A spare H-like sigil made from doubled lines and eleven small cuts.</desc>
  <defs>
    <linearGradient id="main" x1="32" y1="28" x2="148" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6d873"/>
      <stop offset="0.46" stop-color="#35f0e4"/>
      <stop offset="1" stop-color="#ff2d78"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g opacity="0.28" stroke="#35f0e4" stroke-width="3">
      <path d="M42 32c-7 21-7 95 0 116"/>
      <path d="M130 32c7 21 7 95 0 116"/>
      <path d="M58 92c18-16 46 16 64 0"/>
    </g>
    <g opacity="0.24" stroke="#ff2d78" stroke-width="3" transform="translate(10 -7) scale(1 1.06)">
      <path d="M42 32c-7 21-7 95 0 116"/>
      <path d="M130 32c7 21 7 95 0 116"/>
      <path d="M58 92c18-16 46 16 64 0"/>
    </g>
    <g filter="url(#glow)" stroke="url(#main)" stroke-width="4.5">
      <path d="M47 35c-8 22-8 88 0 110"/>
      <path d="M133 35c8 22 8 88 0 110"/>
      <path d="M63 91c16-13 38 13 54 0"/>
    </g>
    <g stroke="#f6d873" stroke-width="2.2" opacity="0.8">
      <path d="M86 31h8"/>
      <path d="M80 43h20"/>
      <path d="M75 55h30"/>
      <path d="M72 67h36"/>
      <path d="M70 79h40"/>
      <path d="M69 91h42"/>
      <path d="M70 103h40"/>
      <path d="M72 115h36"/>
      <path d="M75 127h30"/>
      <path d="M80 139h20"/>
      <path d="M86 151h8"/>
    </g>
  </g>
</svg>
